name = "kazaguruma"
main = "backend/worker.js"
compatibility_date = "2026-10-22"

[dev]
ip = "127.0.0.1"
port = 8787

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "PINWHEEL"
class_name = "Pinwheel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pinwheel"]
