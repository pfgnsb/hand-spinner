<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハンドスピナー</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 2cm 0;
      background: #fff;
    }

    .speed {
      position: fixed;
      top: 50%;
      z-index: 1;
      height: 1.4cm;
      margin-top: -0.7cm;
      border: 1px solid #222;
      background: #fff;
      font: 16px sans-serif;
      cursor: pointer;
    }

    .speed.left {
      left: 0;
      width: 50%;
    }

    .speed.right {
      right: 0;
      width: 50%;
    }

    .mover {
      position: relative;
      z-index: 2;
      width: 10cm;
      height: 10cm;
      pointer-events: none;
    }

    .spinner {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .arm,
    .axis,
    .joints {
      pointer-events: auto;
    }

    .arm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4.1cm;
      height: 4.2cm;
      margin-left: -2.05cm;
      background: #111;
      transform-origin: top center;
    }

    .arm:nth-child(1) {
      transform: rotate(180deg);
    }

    .arm:nth-child(2) {
      transform: rotate(300deg);
    }

    .arm:nth-child(3) {
      transform: rotate(60deg);
    }

    .tip {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 4.1cm;
      height: 4.1cm;
      margin-left: -2.05cm;
      margin-bottom: -2.05cm;
      background: #111;
      border-radius: 50%;
    }

    .spinner.square .tip {
      border-radius: 0;
    }

    .joints {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .joints path {
      fill: #111;
    }

    .axis {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: 2.2cm;
      height: 2.2cm;
      margin-left: -1.1cm;
      margin-top: -1.1cm;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 0 0.28cm, #9ec9ef 0.32cm 100%);
      box-shadow: inset 0 0 0 0.12cm #6aa6d6;
    }
  </style>
</head>
<body>
  <button type="button" class="speed left" id="slow">0.5倍</button>
  <button type="button" class="speed right" id="quick">2.5倍</button>
  <div class="mover" id="mover">
    <div class="spinner" id="spinner">
      <div class="arm"><span class="tip"></span></div>
      <div class="arm"><span class="tip"></span></div>
      <div class="arm"><span class="tip"></span></div>
      <svg class="joints" viewBox="-5 -5 10 10" aria-hidden="true">
        <path d="M 0.35 -0.4 L 0.35 -1.9 Q 2.639 -1.523 1.82 0.647 L 0.521 -0.103 Z"></path>
        <path d="M 0.35 -0.4 L 0.35 -1.9 Q 2.639 -1.523 1.82 0.647 L 0.521 -0.103 Z" transform="rotate(120)"></path>
        <path d="M 0.35 -0.4 L 0.35 -1.9 Q 2.639 -1.523 1.82 0.647 L 0.521 -0.103 Z" transform="rotate(240)"></path>
      </svg>
      <div class="axis" role="img" aria-label="中央の軸"></div>
    </div>
  </div>
  <script>
    var spinner = document.getElementById("spinner");
    var angle = -15;
    var omega = 0;
    var speed = 1;
    var last = 0;
    var drag = null;
    var gestureAt = 0;
    var CLICK_MOVE = 6;
    var SPIN = 0.36;
    var SLOW = 0.5;
    var QUICK = 2.5;
    var ARM_NORMAL = 4.2;
    var ARM_MIN = 1;
    var ARM_MAX = 8;
    var ARM_HOLD = 1000;
    var ARM_CM_PER_MS = 3.2 / 3000;
    var arms = spinner.querySelectorAll(".arm");
    var armsChanging = false;
    var armPhase = "";
    var armFrom = ARM_NORMAL;
    var armTo = ARM_MIN;
    var armPhaseStart = 0;
    var armMoveMs = 1;

    function ease(t) {
      return 0.5 - 0.5 * Math.cos(Math.PI * t);
    }

    function startMove(now, from, to) {
      armPhase = "move";
      armFrom = from;
      armTo = to;
      armPhaseStart = now;
      armMoveMs = Math.max(Math.abs(to - from) / ARM_CM_PER_MS, 1);
    }

    function startHold(now, length, next) {
      armPhase = "hold";
      armFrom = length;
      armTo = next;
      armPhaseStart = now;
    }

    function armLength(now) {
      if (speed !== QUICK) {
        armsChanging = false;
        return ARM_NORMAL;
      }
      if (!armsChanging) {
        armsChanging = true;
        startMove(now, ARM_NORMAL, ARM_MIN);
      }
      if (armPhase === "hold") {
        if (now - armPhaseStart >= ARM_HOLD) {
          startMove(now, armFrom, armTo);
        }
        return armFrom;
      }
      var t = (now - armPhaseStart) / armMoveMs;
      if (t >= 1) {
        var arrived = armTo;
        startHold(now, arrived, arrived === ARM_MIN ? ARM_MAX : ARM_MIN);
        return arrived;
      }
      return armFrom + (armTo - armFrom) * ease(t);
    }

    function draw(now) {
      var length = armLength(now);
      for (var i = 0; i < arms.length; i++) {
        arms[i].style.height = length + "cm";
      }
      spinner.style.transform = "rotate(" + angle + "deg)";
    }

    function frame(now) {
      if (!last) {
        last = now;
      }
      var dt = now - last;
      last = now;
      angle += omega * dt * speed;
      draw(now);
      requestAnimationFrame(frame);
    }

    spinner.addEventListener("pointerdown", function (event) {
      if (event.button !== 0) {
        return;
      }
      drag = {
        moved: 0,
        x: event.clientX,
        y: event.clientY
      };
      spinner.setPointerCapture(event.pointerId);
    });

    spinner.addEventListener("pointermove", function (event) {
      if (!drag) {
        return;
      }
      drag.moved = Math.hypot(event.clientX - drag.x, event.clientY - drag.y);
    });

    function endPointer(event) {
      if (!drag) {
        return;
      }
      var moved = drag.moved;
      drag = null;
      gestureAt = performance.now();
      if (moved >= CLICK_MOVE) {
        return;
      }
      omega = SPIN;
    }

    spinner.addEventListener("pointerup", endPointer);
    spinner.addEventListener("pointercancel", function () {
      drag = null;
    });

    function holdSpeed(button, rate) {
      button.addEventListener("pointerdown", function (event) {
        if (event.button !== 0) {
          return;
        }
        event.stopPropagation();
        speed = rate;
        button.setPointerCapture(event.pointerId);
      });
      function release(event) {
        event.stopPropagation();
        speed = 1;
      }
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }

    holdSpeed(document.getElementById("slow"), SLOW);
    holdSpeed(document.getElementById("quick"), QUICK);

    document.addEventListener("click", function (event) {
      if (performance.now() - gestureAt < 400) {
        return;
      }
      if (event.target.closest(".arm") || event.target.closest(".axis") || event.target.closest(".joints") || event.target.closest(".speed")) {
        return;
      }
      var top = spinner.getBoundingClientRect().top;
      if (event.clientY < top) {
        spinner.classList.toggle("square");
        return;
      }
      omega = 0;
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>
