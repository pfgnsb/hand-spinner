<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハンドスピナー</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 2cm 0;
      background: #fff;
    }

    .speed {
      position: fixed;
      top: 50%;
      z-index: 1;
      height: 1.4cm;
      margin-top: -0.7cm;
      border: 1px solid #222;
      background: #fff;
      font: 16px sans-serif;
      cursor: pointer;
    }

    .speed.left {
      left: 0;
      width: 50%;
    }

    .speed.right {
      right: 0;
      width: 50%;
    }

    .mover {
      position: relative;
      z-index: 2;
      width: 30cm;
      height: 30cm;
      pointer-events: none;
    }

    .spinner {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .arm,
    .axis {
      pointer-events: auto;
    }

    .arm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.35cm;
      height: 15cm;
      margin-left: -0.175cm;
      background: #111;
      transform-origin: top center;
    }

    .arm:nth-child(1) {
      transform: rotate(180deg);
    }

    .arm:nth-child(2) {
      transform: rotate(300deg);
    }

    .arm:nth-child(3) {
      transform: rotate(60deg);
    }

    .tip {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 1.6cm;
      height: 1.6cm;
      margin-left: -0.8cm;
      margin-bottom: -0.8cm;
      background: #111;
      border-radius: 50%;
    }

    .spinner.square .tip {
      border-radius: 0;
    }

    .axis {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: 2.2cm;
      height: 2.2cm;
      margin-left: -1.1cm;
      margin-top: -1.1cm;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 0 0.28cm, #9ec9ef 0.32cm 100%);
      box-shadow: inset 0 0 0 0.12cm #6aa6d6;
    }
  </style>
</head>
<body>
  <button type="button" class="speed left" id="slow">1.0倍</button>
  <button type="button" class="speed right" id="quick">1.0倍</button>
  <div class="mover" id="mover">
    <div class="spinner" id="spinner">
      <div class="arm"><span class="tip"></span></div>
      <div class="arm"><span class="tip"></span></div>
      <div class="arm"><span class="tip"></span></div>
      <div class="axis" role="img" aria-label="中央の軸"></div>
    </div>
  </div>
  <script>
    var spinner = document.getElementById("spinner");
    var mover = document.getElementById("mover");
    var angle = -15;
    var omega = 0;
    var decay = 0;
    var speed = 1;
    var bobbing = false;
    var bobOffset = 0;
    var bobStart = 0;
    var last = 0;
    var drag = null;
    var BOB_CM = 5;
    var BOB_MS = 30000;

    function draw(now) {
      var bob = bobOffset;
      if (bobbing) {
        bob = BOB_CM * Math.sin(((now - bobStart) / BOB_MS) * Math.PI * 2);
      }
      mover.style.transform = "translateY(" + bob + "cm)";
      spinner.style.transform = "rotate(" + angle + "deg)";
    }

    function frame(now) {
      if (!last) {
        last = now;
      }
      var dt = now - last;
      last = now;
      if (omega !== 0) {
        var before = omega;
        angle += omega * dt * speed;
        omega -= Math.sign(before) * decay * dt;
        if (before * omega <= 0) {
          omega = 0;
        }
      }
      draw(now);
      requestAnimationFrame(frame);
    }

    function centerOf(event) {
      var rect = spinner.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function pointerAngle(event) {
      var center = centerOf(event);
      return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
    }

    spinner.addEventListener("pointerdown", function (event) {
      if (event.button !== 0) {
        return;
      }
      drag = {
        lastAngle: pointerAngle(event),
        swept: 0,
        moved: 0,
        start: performance.now(),
        x: event.clientX,
        y: event.clientY
      };
      spinner.setPointerCapture(event.pointerId);
    });

    spinner.addEventListener("pointermove", function (event) {
      if (!drag) {
        return;
      }
      var next = pointerAngle(event);
      var delta = next - drag.lastAngle;
      if (delta > 180) {
        delta -= 360;
      }
      if (delta < -180) {
        delta += 360;
      }
      drag.swept += delta;
      drag.lastAngle = next;
      drag.moved = Math.hypot(event.clientX - drag.x, event.clientY - drag.y);
    });

    function endDrag(event) {
      if (!drag) {
        return;
      }
      var moved = drag.moved;
      var swept = drag.swept;
      var elapsed = Math.max(performance.now() - drag.start, 16);
      drag = null;
      if (moved < 6) {
        return;
      }
      omega = swept / elapsed;
      decay = Math.max(0.00035, Math.abs(omega) * 0.8);
    }

    spinner.addEventListener("pointerup", endDrag);
    spinner.addEventListener("pointercancel", endDrag);

    document.querySelectorAll(".speed").forEach(function (button) {
      button.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        speed = 1;
      });
      button.addEventListener("pointerup", function () {
        speed = 1;
      });
      button.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    });

    document.addEventListener("click", function (event) {
      if (event.target.closest(".arm") || event.target.closest(".axis") || event.target.closest(".speed")) {
        return;
      }
      var top = spinner.getBoundingClientRect().top;
      if (event.clientY < top) {
        spinner.classList.toggle("square");
        return;
      }
      if (bobbing) {
        bobOffset = BOB_CM * Math.sin(((performance.now() - bobStart) / BOB_MS) * Math.PI * 2);
        bobbing = false;
        return;
      }
      bobbing = true;
      bobStart = performance.now();
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>
