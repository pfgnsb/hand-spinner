<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>風車</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #fff;
    }

    .turn {
      position: fixed;
      top: 50%;
      z-index: 1;
      margin: 0;
      transform: translateY(-50%);
      color: #111;
      font: 1.8cm sans-serif;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .turn.left {
      left: 0.6cm;
    }

    .turn.right {
      right: 0.6cm;
    }

    .toy {
      position: relative;
      z-index: 2;
      width: 0;
      height: 0;
    }

    .stick {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 0;
      width: 0.34cm;
      height: 7.2cm;
      margin-left: -0.17cm;
      background: linear-gradient(90deg, #8d5a2b, #e4c092 42%, #7a4e24);
      border-radius: 0.17cm;
      pointer-events: auto;
    }

    .spinner {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
      width: 8.4cm;
      height: 8.4cm;
      margin-left: -4.2cm;
      margin-top: -4.2cm;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .spinner svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: auto;
    }

    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: 0.62cm;
      height: 0.62cm;
      margin-left: -0.31cm;
      margin-top: -0.31cm;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f7f7f7 0 0.08cm, #1a1a1a 0.14cm 100%);
      box-shadow: 0 0.04cm 0.08cm rgba(0, 0, 0, 0.25);
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="turn left" aria-hidden="true">↺</div>
  <div class="turn right" aria-hidden="true">↻</div>
  <div class="toy" id="toy">
    <div class="stick"></div>
    <div class="spinner" id="spinner">
      <svg viewBox="-50 -50 100 100" aria-hidden="true">
        <path fill="#e23b3b" d="M 0 0 C 6 -22 34 -28 46 -4 C 30 8 8 6 0 0 Z" transform="rotate(-90)"></path>
        <path fill="#2f6fed" d="M 0 0 C 6 -22 34 -28 46 -4 C 30 8 8 6 0 0 Z"></path>
        <path fill="#f0c43a" d="M 0 0 C 6 -22 34 -28 46 -4 C 30 8 8 6 0 0 Z" transform="rotate(90)"></path>
        <path fill="#2fa36a" d="M 0 0 C 6 -22 34 -28 46 -4 C 30 8 8 6 0 0 Z" transform="rotate(180)"></path>
      </svg>
      <div class="pin" role="img" aria-label="中心のピン"></div>
    </div>
  </div>
  <script>
    var toy = document.getElementById("toy");
    var spinner = document.getElementById("spinner");
    var angle = -15;
    var omega = 0;
    var speed = 1;
    var last = 0;
    var drag = null;
    var gestureAt = 0;
    var ready = false;
    var loaded = false;
    var tick = null;
    var saveQueue = Promise.resolve();
    var CLICK_MOVE = 6;
    var SPIN = 0.36;
    var FAST = 2;

    function draw() {
      spinner.style.transform = "rotate(" + angle + "deg)";
    }

    function payload() {
      return JSON.stringify({ angle: angle, omega: omega, speed: speed });
    }

    function saveState() {
      if (!loaded) {
        return;
      }
      var body = payload();
      saveQueue = saveQueue.then(function () {
        return fetch("/api/state", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: body
        });
      }).catch(function () {});
    }

    function syncTick() {
      if (omega !== 0 && !tick) {
        tick = setInterval(saveState, 400);
      }
      if (omega === 0 && tick) {
        clearInterval(tick);
        tick = null;
      }
    }

    function frame(now) {
      if (!last) {
        last = now;
      }
      var dt = now - last;
      last = now;
      if (omega !== 0) {
        angle += omega * dt * speed;
      }
      draw();
      requestAnimationFrame(frame);
    }

    toy.addEventListener("pointerdown", function (event) {
      if (!ready || event.button !== 0) {
        return;
      }
      drag = {
        moved: 0,
        x: event.clientX,
        y: event.clientY
      };
      toy.setPointerCapture(event.pointerId);
    });

    toy.addEventListener("pointermove", function (event) {
      if (!drag) {
        return;
      }
      drag.moved = Math.hypot(event.clientX - drag.x, event.clientY - drag.y);
    });

    function endPointer(event) {
      if (!drag) {
        return;
      }
      var moved = drag.moved;
      drag = null;
      gestureAt = performance.now();
      if (moved >= CLICK_MOVE) {
        return;
      }
      omega = omega === 0 ? SPIN : 0;
      saveState();
      syncTick();
    }

    toy.addEventListener("pointerup", endPointer);
    toy.addEventListener("pointercancel", function () {
      drag = null;
    });

    document.addEventListener("click", function (event) {
      if (!ready) {
        return;
      }
      if (performance.now() - gestureAt < 400) {
        return;
      }
      if (event.target.closest("#toy")) {
        return;
      }
      var box = spinner.getBoundingClientRect();
      if (event.clientY < box.top) {
        speed = speed === FAST ? 1 : FAST;
        saveState();
        return;
      }
      if (event.clientX < box.left) {
        omega = -SPIN;
        saveState();
        syncTick();
        return;
      }
      if (event.clientX > box.right) {
        omega = SPIN;
        saveState();
        syncTick();
        return;
      }
      omega = 0;
      saveState();
      syncTick();
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        saveState();
      }
    });

    window.addEventListener("pagehide", function () {
      if (!loaded) {
        return;
      }
      fetch("/api/state", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload(),
        keepalive: true
      });
    });

    fetch("/api/state").then(function (res) {
      if (!res.ok) {
        throw new Error("state");
      }
      return res.json();
    }).then(function (state) {
      angle = Number(state.angle);
      omega = Number(state.omega);
      speed = Number(state.speed);
      loaded = true;
    }).catch(function () {}).then(function () {
      ready = true;
      draw();
      syncTick();
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
