<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>映画鑑賞</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <p class="kicker">選択ボード</p>
      <h1>映画鑑賞</h1>
      <p class="note">作品はつまんで移動できます。ページを閉じると元に戻ります。</p>
    </header>

    <main class="board" aria-label="選択ボード">
      <section class="state" aria-label="見たい">
        <h2>見たい</h2>
        <div class="works">
          <article class="work">
            <h3 class="work-title">君の名は。</h3>
            <div class="work-actions">
              <button type="button" data-action="edit">編集</button>
              <button type="button" data-action="delete">削除</button>
            </div>
          </article>
          <article class="work">
            <h3 class="work-title">インターステラー</h3>
            <div class="work-actions">
              <button type="button" data-action="edit">編集</button>
              <button type="button" data-action="delete">削除</button>
            </div>
          </article>
        </div>
        <form class="adder">
          <input type="text" aria-label="見たいに追加する作品の名前" />
          <button type="submit">追加</button>
          <p class="adder-error" hidden>名前を入力してください。</p>
        </form>
      </section>

      <section class="state" aria-label="途中">
        <h2>途中</h2>
        <div class="works">
          <article class="work">
            <h3 class="work-title">三体</h3>
            <div class="work-actions">
              <button type="button" data-action="edit">編集</button>
              <button type="button" data-action="delete">削除</button>
            </div>
          </article>
        </div>
        <form class="adder">
          <input type="text" aria-label="途中に追加する作品の名前" />
          <button type="submit">追加</button>
          <p class="adder-error" hidden>名前を入力してください。</p>
        </form>
      </section>

      <section class="state" aria-label="見た">
        <h2>見た</h2>
        <div class="works">
          <article class="work">
            <h3 class="work-title">ショーシャンクの空に</h3>
            <div class="work-actions">
              <button type="button" data-action="edit">編集</button>
              <button type="button" data-action="delete">削除</button>
            </div>
          </article>
        </div>
        <form class="adder">
          <input type="text" aria-label="見たに追加する作品の名前" />
          <button type="submit">追加</button>
          <p class="adder-error" hidden>名前を入力してください。</p>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
